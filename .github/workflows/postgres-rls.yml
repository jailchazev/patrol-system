name: PostgreSQL RLS integration

on:
  push:
    branches:
      - architecture/multitenant-foundation
  pull_request:
    branches:
      - main

jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d patrol_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d patrol_test -v ON_ERROR_STOP=1 -c "CREATE ROLE patrol_rls_app LOGIN PASSWORD 'rls-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE patrol_test TO patrol_rls_app"
      - name: Run PostgreSQL RLS integration tests
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/patrol_test
          TEST_POSTGRES_APP_URL: postgresql://patrol_rls_app:rls-test-password@localhost:5432/patrol_test
        run: python -m pytest -q tests/test_postgres_rls.py
